<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110F">
<title>Проявочная</title>
<style>
:root{
  --ink:#16110F; --tray:#221A16; --edge:#3A2A22;
  --paper:#EDE6D8; --muted:#9A8878;
  --safelight:#FFB020; --oxblood:#8C2A16;
  --ui:ui-monospace,Menlo,"Courier New",monospace;
  --bar:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:15px;
  display:flex;flex-direction:column;height:100dvh}

.top{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  border-bottom:1px solid var(--edge)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-size:16px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0}
.mark span{color:var(--safelight)}
.headside{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tgl{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border:1px solid var(--edge);border-radius:3px;background:#191211;color:#2AABEE;
  transition:color .15s,border-color .15s,background .15s}
.tgl:hover{background:#20211f;border-color:#2AABEE}
.tgl:focus-visible{outline:2px solid var(--safelight);outline-offset:2px}
.lang{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden;flex:0 0 auto}
.lang button{background:#191211;color:var(--muted);border:0;font-family:var(--ui);
  font-size:11px;letter-spacing:.1em;padding:8px 11px;min-height:34px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--safelight);color:#1A1109;font-weight:700}
.status{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.04em;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.status.bad{color:#FF7A5C}
.status.good{color:var(--safelight)}

.tabs{display:flex;gap:22px;margin-top:10px}
.tabs button{background:none;border:0;padding:10px 0;cursor:pointer;
  font-family:var(--ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--paper);border-bottom-color:var(--safelight)}

.tools{display:flex;gap:6px;padding:0 0 10px;flex-wrap:wrap}
.tools[hidden]{display:none}
.tbtn{flex:1 1 auto;min-height:42px;padding:0 10px;border:1px solid var(--edge);
  background:#191211;color:var(--muted);border-radius:3px;cursor:pointer;
  font-family:var(--ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tbtn[aria-pressed=true]{background:var(--safelight);border-color:var(--safelight);
  color:#1A1109;font-weight:700}
.tbtn.auto{background:var(--oxblood);border-color:var(--oxblood);color:var(--paper);
  flex:1.4 1 auto;font-weight:700}
.tbtn.auto:disabled{opacity:.5}

.stage{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;
  display:flex;align-items:flex-start;justify-content:center}
.board{border-radius:3px;padding:8px;max-width:100%;background-color:#3A2A22;
  background-image:
    linear-gradient(45deg,#2A1F1A 25%,transparent 25%,transparent 75%,#2A1F1A 75%),
    linear-gradient(45deg,#2A1F1A 25%,transparent 25%,transparent 75%,#2A1F1A 75%);
  background-size:18px 18px;background-position:0 0,9px 9px}
.board.flat{background:var(--paper);background-image:none}
.board.flat.dark{background:#0C0908}
canvas{display:block;max-width:100%;height:auto;border-radius:2px}

.bar{flex:0 0 auto;background:var(--tray);border-top:1px solid var(--edge);
  padding:10px 12px calc(10px + var(--bar));display:flex;gap:8px}
.bar>*{flex:1;min-height:54px;border-radius:3px;border:1px solid var(--edge);
  background:#191211;color:var(--paper);font-family:var(--ui);font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.bar .hot{background:var(--oxblood);border-color:var(--oxblood)}
.bar .amber{background:var(--safelight);border-color:var(--safelight);color:#1A1109;font-weight:700}
.bar>*:active{transform:scale(.97)}
.bar>*:disabled{opacity:.4}
.bar>*[hidden]{display:none}
@media (max-width:430px){ .bar>*{font-size:9px;letter-spacing:.02em;padding:3px} }
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-visible{
  outline:2px solid var(--safelight);outline-offset:2px}

.pickers{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.scrim{position:fixed;inset:0;background:rgba(10,7,6,.6);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--tray);
  border-top:1px solid var(--edge);border-radius:14px 14px 0 0;
  padding:8px 18px calc(22px + var(--bar));transform:translateY(102%);
  transition:transform .25s cubic-bezier(.2,.8,.3,1);max-height:86dvh;overflow:auto}
.sheet.on{transform:translateY(0)}
.grip{width:42px;height:4px;border-radius:2px;background:#4E3A2E;margin:6px auto 12px}
.mini{position:sticky;top:0;z-index:2;background:var(--tray);
  padding:0 0 12px;margin-bottom:6px;border-bottom:1px solid var(--edge);
  display:flex;justify-content:center}
.mini[hidden]{display:none}
.mini .frame{background:var(--paper);border-radius:3px;padding:5px;line-height:0}
.mini .frame.dark{background:#0C0908}
.mini .frame.check{background-color:#3A2A22;background-image:
  linear-gradient(45deg,#2A1F1A 25%,transparent 25%,transparent 75%,#2A1F1A 75%),
  linear-gradient(45deg,#2A1F1A 25%,transparent 25%,transparent 75%,#2A1F1A 75%);
  background-size:12px 12px;background-position:0 0,6px 6px}
.row-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.row-lbl b{color:var(--safelight);font-weight:700;letter-spacing:0}
.fld{margin-bottom:22px}
.fld[hidden],.chip[hidden]{display:none}
input[type=range]{width:100%;height:34px;accent-color:var(--safelight);background:transparent}
select,input[type=text]{width:100%;min-height:48px;background:#191211;color:var(--paper);
  border:1px solid var(--edge);border-radius:3px;padding:0 12px;font-family:var(--ui);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 30%;min-height:46px;border:1px solid var(--edge);background:#191211;color:var(--muted);
  border-radius:3px;font-family:var(--ui);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;cursor:pointer;padding:4px;
  display:flex;align-items:center;justify-content:center;text-align:center}
.chip[aria-pressed=true]{background:var(--safelight);border-color:var(--safelight);
  color:#1A1109;font-weight:700}
.tip{margin:0 0 18px;padding:10px 12px;border-left:2px solid var(--safelight);
  background:rgba(255,176,32,.08);font-size:12px;line-height:1.6}
.tip[hidden]{display:none}

.ask{position:fixed;left:0;right:0;bottom:calc(84px + var(--bar));z-index:7;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px}
.ask[hidden]{display:none}
.ask-q{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);
  background:var(--tray);border:1px solid var(--edge);border-radius:3px;padding:8px 14px}
.ask-btns{display:flex;gap:10px;width:100%;max-width:420px}
.ask-btns button{flex:1;min-height:56px;border-radius:3px;font-family:var(--ui);
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-weight:700}
#askPerson{background:var(--safelight);border:1px solid var(--safelight);color:#1A1109}
#askThing{background:var(--oxblood);border:1px solid var(--oxblood);color:var(--paper)}
.ask-btns button:active{transform:scale(.97)}

.viewer{position:fixed;inset:0;z-index:20;background:#0C0908;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(16px + var(--bar))}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:3px}
.viewer .hint{margin:0;font-size:12px;color:var(--safelight);text-align:center;line-height:1.6}
.vclose{min-height:50px;padding:0 26px;border-radius:3px;border:1px solid var(--edge);
  background:#191211;color:var(--paper);font-family:var(--ui);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <div class="head">
    <h1 class="mark" id="mark"></h1>
    <div class="headside">
      <a class="tgl" href="https://t.me/ProstoAyli" target="_blank" rel="noopener"
         aria-label="Telegram: Просто Айли" title="Просто Айли">
        <svg viewBox="0 0 240 240" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M228.6 4.9 10.9 90.6c-9.3 3.7-9 13.2.3 16.3l55.4 17.6 21.4 65.7c2.2 6.2 6.9 7.7 11.4 3.7l30.9-28.3 57 42c6.6 3.7 12.4.9 14.1-6.6L239.4 16c2.1-9-4-13.9-10.8-11.1ZM86.5 118.6l111-70.3c4.2-2.6 8.1-1.2 5 1.7l-91.4 83.3-3.6 39.7-21-54.4Z"/>
        </svg>
      </a>
      <div class="lang" role="group" aria-label="Language">
        <button id="ru" aria-pressed="true">RU</button>
        <button id="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="tabs" role="tablist">
    <button id="tabCut" role="tab" aria-selected="true" data-t="tab_cut"></button>
    <button id="tabArt" role="tab" aria-selected="false" data-t="tab_art"></button>
    <button id="tabQr" role="tab" aria-selected="false" data-t="tab_qr"></button>
  </div>
  <div class="tools" id="tools">
    <button class="tbtn auto" id="tAuto" data-t="autocut"></button>
    <button class="tbtn" id="tWand" aria-pressed="false" data-t="t_wand"></button>
    <button class="tbtn" id="tErase" aria-pressed="false" data-t="t_erase"></button>
    <button class="tbtn" id="tRestore" aria-pressed="false" data-t="t_restore"></button>
    <button class="tbtn" id="tUndo" data-t="undo"></button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="board" id="board"><canvas id="cv"></canvas></div>
</div>

<div class="bar">
  <button id="paste" class="hot" data-t="paste"></button>
  <label for="fLib" tabindex="0" data-t="gallery"></label>
  <button id="tune" data-t="settings"></button>
  <button id="toArt" class="amber" disabled data-t="toart"></button>
  <button id="copy" hidden data-t="copy"></button>
  <button id="dl" class="amber" hidden disabled data-t="download"></button>
</div>

<div class="pickers">
  <input type="file" id="fCam" accept="image/*" capture="environment">
  <input type="file" id="fLib" accept="image/*">
  <input type="file" id="fScan" accept="image/*">
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Settings">
  <div class="grip"></div>
  <div class="mini" id="miniBox" hidden>
    <div class="frame" id="miniFrame"><canvas id="mini"></canvas></div>
  </div>
  <p class="tip" id="tipCut"></p>
  <p class="tip" id="tipEmoji" hidden></p>

  <!-- вкладка «Вырезать» -->
  <div class="fld" data-grp="cut">
    <div class="row-lbl"><span data-t="bg"></span></div>
    <select id="bg">
      <option value="none" selected data-t="bg_none"></option>
      <option value="white" data-t="bg_white"></option>
      <option value="dark" data-t="bg_dark"></option>
      <option value="blur" data-t="bg_blur"></option>
    </select>
  </div>
  <div class="fld" data-grp="cut">
    <div class="row-lbl"><span data-t="soft"></span><b id="softVal">2</b></div>
    <input type="range" id="soft" min="0" max="8" step="1" value="2">
  </div>
  <div class="fld" data-grp="cut">
    <div class="row-lbl"><span data-t="edge"></span><b id="edgeVal">0</b></div>
    <input type="range" id="edge" min="-40" max="40" step="2" value="0">
  </div>

  <p class="tip" data-grp="cut" id="tipManual"></p>
  <div class="fld" data-grp="cut">
    <div class="row-lbl"><span data-t="tool"></span></div>
    <select id="tool">
      <option value="none" selected data-t="t_none"></option>
      <option value="wand" data-t="t_wand"></option>
      <option value="erase" data-t="t_erase"></option>
      <option value="restore" data-t="t_restore"></option>
    </select>
  </div>
  <div class="fld" data-grp="cut">
    <div class="row-lbl"><span data-t="tol"></span><b id="tolVal">32</b></div>
    <input type="range" id="tol" min="8" max="90" step="2" value="32">
  </div>
  <div class="fld" data-grp="cut">
    <div class="row-lbl"><span data-t="brush"></span><b id="brushVal">28</b></div>
    <input type="range" id="brush" min="6" max="90" step="2" value="28">
  </div>

  <!-- вкладка «QR-код» -->
  <div class="fld" data-grp="qr">
    <div class="row-lbl"><span data-t="code_kind"></span></div>
    <select id="codeKind">
      <option value="qr" selected data-t="kind_qr"></option>
      <option value="bar" data-t="kind_bar"></option>
    </select>
  </div>
  <div class="fld" data-grp="qr">
    <div class="row-lbl"><span data-t="code_size"></span></div>
    <select id="codeSize">
      <option value="s" data-t="sz_s"></option>
      <option value="m" selected data-t="sz_m"></option>
      <option value="l" data-t="sz_l"></option>
    </select>
  </div>
  <div class="fld" data-grp="qr">
    <div class="row-lbl"><span id="qrLbl"></span></div>
    <input type="text" id="qrText" data-t-ph="qr_ph" autocapitalize="off" spellcheck="false">
  </div>
  <div class="fld" data-grp="qr">
    <div class="row-lbl"><span data-t="qr_lvl"></span></div>
    <select id="qrLvl">
      <option value="L" data-t="qr_l"></option>
      <option value="M" selected data-t="qr_m"></option>
      <option value="Q" data-t="qr_q"></option>
      <option value="H" data-t="qr_h"></option>
    </select>
  </div>
  <div class="fld" data-grp="qr">
    <div class="row-lbl"><span data-t="qr_style"></span></div>
    <select id="qrStyle">
      <option value="img" selected data-t="qr_img"></option>
      <option value="blocks" data-t="qr_blocks"></option>
    </select>
    <p class="tip" id="tipQrBlocks" hidden></p>
    <p class="tip" id="tipBar" hidden></p>
  </div>

  <!-- вкладка «Символы» -->
  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="mode"></span></div>
    <select id="mode">
      <option value="chars" selected data-t="m_chars"></option>
      <option value="emoji" data-t="m_emoji"></option>
      <option value="braille" data-t="m_brl"></option>
    </select>
  </div>
  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="detail"></span><b id="colsVal">90</b></div>
    <input type="range" id="cols" min="24" max="200" step="2" value="90">
  </div>
  <div class="fld" data-grp="art" id="charsetWrap">
    <div class="row-lbl"><span data-t="charset"></span></div>
    <select id="charset">
      <option value="punct" selected data-t="s_punct"></option>
      <option value="classic" data-t="s_classic"></option>
      <option value="detail" data-t="s_detail"></option>
      <option value="blocks" data-t="s_blocks"></option>
      <option value="binary" data-t="s_binary"></option>
      <option value="braille" data-t="s_braille"></option>
      <option value="custom" data-t="s_custom"></option>
    </select>
  </div>
  <div class="fld" data-grp="art" id="customWrap" hidden>
    <div class="row-lbl"><span data-t="darklight"></span></div>
    <input type="text" id="custom" value="(:(;(!.! " spellcheck="false" autocapitalize="off">
  </div>
  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="contrast"></span><b id="conVal">1.20</b></div>
    <input type="range" id="con" min="0.3" max="2.5" step="0.05" value="1.2">
  </div>
  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="bright"></span><b id="briVal">0</b></div>
    <input type="range" id="bri" min="-80" max="80" step="1" value="0">
  </div>
  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="scale"></span><b id="zoomVal"></b></div>
    <input type="range" id="zoom" min="0" max="14" step="1" value="0">
  </div>

  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="target"></span></div>
    <select id="target">
      <option value="none" selected data-t="g_none"></option>
      <option value="steam" data-t="g_steam"></option>
      <option value="tg" data-t="g_tg"></option>
      <option value="vk" data-t="g_vk"></option>
    </select>
    <p class="tip" id="tipTarget" hidden></p>
  </div>

  <div class="fld" data-grp="art">
    <div class="row-lbl"><span data-t="lheight"></span><b id="lhVal">1.00</b></div>
    <input type="range" id="lh" min="0.8" max="1.7" step="0.05" value="1">
    <p class="tip" id="tipLh"></p>
  </div>

  <div class="fld">
    <div class="row-lbl"><span data-t="quality"></span><b id="qVal">1000 px</b></div>
    <input type="range" id="quality" min="600" max="3000" step="100" value="1000">
  </div>

  <div class="chips">
    <label class="chip" for="fCam" id="camLbl" tabindex="0" data-t="camera"></label>
    <button class="chip" id="undo" data-grp="cut" data-t="undo"></button>
    <button class="chip" id="clearmask" data-grp="cut" data-t="clearmask"></button>
    <button class="chip" id="redo" data-grp="cut" data-t="redo"></button>
    <button class="chip" id="invert" data-grp="art" aria-pressed="false" data-t="invert"></button>
    <button class="chip" id="color" data-grp="art" aria-pressed="false" data-t="color"></button>
    <label class="chip" for="fScan" data-grp="qr" tabindex="0" data-t="scan_btn"></label>
    <button class="chip" id="barNum" data-grp="qr" aria-pressed="true" data-t="barnum"></button>
    <button class="chip" id="copyChip" data-t="copy"></button>
    <button class="chip" id="shareChip" data-t="share"></button>
    <button class="chip" id="png" data-t="filepng"></button>
    <button class="chip" id="txt" data-grp="art" data-t="filetxt"></button>
    <button class="chip" id="reset" data-t="reset"></button>
    <button class="chip" id="close" data-t="done"></button>
  </div>
</div>

<div class="ask" id="ask" hidden>
  <p class="ask-q" id="askQ"></p>
  <div class="ask-btns">
    <button id="askPerson"></button>
    <button id="askThing"></button>
  </div>
</div>

<div class="viewer" id="viewer" hidden>
  <p class="hint" id="hint"></p>
  <p class="hint" id="hint2"></p>
  <img id="vimg" alt="">
  <button class="vclose" id="vclose" data-t="closeimg"></button>
</div>

<script>
"use strict";

/* ══════════════════════ словарь ══════════════════════ */
const T={
ru:{
  mark:["Прояво","чная"], title:"Проявочная — вырезать и в символы", htmlLang:"ru",
  ready:"пришли фото — вырежу человека и переведу в символы",
  tab_cut:"Вырезать", tab_art:"Символы", tab_qr:"QR-код",
  qr_ph:"Ссылка, текст или номер…",
  lbl_qr:"Ссылка или текст", lbl_bar:"Номер или код",
  ph_bar:"Номер: 227202250076539133…",
  code_kind:"Тип кода",
  kind_qr:"QR-код", kind_bar:"Штрих-код (Code 128)",
  bar_done:n=>"штрих-код готов · "+n+" полос",
  bars_done:n=>"готово "+n+" штрих-кода — один под другим, как на чеке",
  bar_hint:"несколько чисел вводи через пробел — получишь несколько кодов",
  scan_btn:"Прочитать с фото",
  cam_scan:"Снять код камерой",
  code_size:"Размер кода", sz_s:"Малый", sz_m:"Обычный", sz_l:"Крупный",
  barnum:"Номер под кодом",
  scanning:"ищу штрих-код на снимке…",

const C128=["11011001100","11001101100","11001100110","10010011000","10010001100","10001001100","10011001000","10011000100","10001100100","11001001000","11001000100","11000100100","10110011100","10011011100","10011001110","10111001100","10011101100","10011100110","11001110010","11001011100","11001001110","11011100100","11001110100","11101101110","11101001100","11100101100","11100100110","11101100100","11100110100","11100110010","11011011000","11011000110","11000110110","10100011000","10001011000","10001000110","10110001000","10001101000","10001100010","11010001000","11000101000","11000100010","10110111000","10110001110","10001101110","10111011000","10111000110","10001110110","11101110110","11010001110","11000101110","11011101000","11011100010","11011101110","11101011000","11101000110","11100010110","11101101000","11101100010","11100011010","11101111010","11001000010","11110001010","10100110000","10100001100","10010110000","10010000110","10000101100","10000100110","10110010000","10110000100","10011010000","10011000010","10000110100","10000110010","11000010010","11001010000","11110111010","11000010100","10001111010","10100111100","10010111100","10010011110","10111100100","10011110100","10011110010","11110100100","11110010100","11110010010","11011011110","11011110110","11110110110","10101111000","10100011110","10001011110","10111101000","10111100010","11110101000","11110100010","10111011110","10111101110","11101011110","11110101110","11010000100","11010010000","11010011100"];
const C128STOP="1100011101011";
function code128(text){
  if([...text].some(c=>c.charCodeAt(0)<32||c.charCodeAt(0)>126)) return {err:"ascii"};
  if(text.length>40) return {err:"long"};
  const vals=[];
  let i=0, mode=null;
  const digits=j=>{let n=0;while(j+n<text.length&&text[j+n]>='0'&&text[j+n]<='9')n++;return n;};
  while(i<text.length){
    const d=digits(i);
    if((d>=4&&d%2===0)||(mode==='C'&&d>=2)||d>=6){
      if(mode!=='C'){ vals.push(vals.length?99:105); mode='C'; }
      vals.push(+text.slice(i,i+2)); i+=2;
    }else{
      if(mode!=='B'){ vals.push(vals.length?100:104); mode='B'; }
      vals.push(text.charCodeAt(i)-32); i++;
    }
  }
  let sum=vals[0];
  for(let j=1;j<vals.length;j++) sum+=vals[j]*j;
  vals.push(sum%103);
  let bits="";
  for(const v of vals) bits+=C128[v];
  return {bits:bits+C128STOP};
}

/* ══════════════════ чтение Code 128 с фото ══════════════════ */
/* Чтение Code 128 с фотографии.
   Ядро повторяет проверенный подход ZXing: символ определяется не жёстким
   округлением ширин, а выбором ближайшего образца по среднему отклонению. */

function makeDecoder(C128, C128STOP){
  function pat2runs(p){
    const r=[]; let n=1;
    for(let i=1;i<p.length;i++){ if(p[i]===p[i-1])n++; else{r.push(n);n=1;} }
    r.push(n); return r;
  }
  const PATTERNS=C128.map(pat2runs);
  PATTERNS.push(pat2runs(C128STOP));
  const STOP=106;
  const MAX_AVG=0.25, MAX_ONE=0.7;

  function variance(counters, pattern){
    let total=0, plen=0;
    for(let i=0;i<counters.length;i++){ total+=counters[i]; plen+=pattern[i]; }
    if(total<plen) return Infinity;
    const unit=total/plen, maxOne=MAX_ONE*unit;
    let sum=0;
    for(let i=0;i<counters.length;i++){
      const d=Math.abs(counters[i]-pattern[i]*unit);
      if(d>maxOne) return Infinity;
      sum+=d;
    }
    return sum/total;
  }

  function bestCode(counters){
    let best=-1, bestV=MAX_AVG;
    for(let c=0;c<PATTERNS.length;c++){
      const p=PATTERNS[c];
      const v=variance(counters, p.length===7?p.slice(0,6):p);
      if(v<bestV){ bestV=v; best=c; }
    }
    return best;
  }

  function valsToText(vals){
    const start=vals[0];
    if(start<103||start>105) return null;
    const check=vals[vals.length-1];
    let sum=start;
    for(let i=1;i<vals.length-1;i++) sum+=vals[i]*i;
    if(sum%103!==check) return null;
    /* Значения 96–101 означают разное в разных наборах!
       В цифровом C любое 0..99 — это пара цифр, а не служебный код. */
    let mode = start===105?"C":(start===104?"B":"A");
    let out="";
    for(let i=1;i<vals.length-1;i++){
      const v=vals[i];
      if(mode==="C"){
        if(v<=99){ out+=String(v).padStart(2,"0"); continue; }
        if(v===100){ mode="B"; continue; }
        if(v===101){ mode="A"; continue; }
        continue;                              // 102 — FNC1
      }
      if(mode==="B"){
        if(v<=95){ out+=String.fromCharCode(v+32); continue; }
        if(v===99){ mode="C"; continue; }
        if(v===100){ mode="A"; continue; }
        continue;                              // 96,97,98,101,102 — служебные
      }
      /* набор A */
      if(v<=63){ out+=String.fromCharCode(v+32); continue; }
      if(v<=95) continue;                       // управляющие символы
      if(v===99){ mode="C"; continue; }
      if(v===100){ mode="B"; continue; }
    }
    return out.length?out:null;
  }

  function readAt(line,thr){
    const n=line.length;
    const runs=[], dark=[];
    let cur=line[0]<thr, len=1;
    for(let i=1;i<n;i++){
      const d=line[i]<thr;
      if(d===cur) len++;
      else { runs.push(len); dark.push(cur); len=1; cur=d; }
    }
    runs.push(len); dark.push(cur);

    const found=[];
    for(let s=0;s+6<runs.length;s++){
      if(!dark[s]) continue;
      const six=runs.slice(s,s+6);
      const code=bestCode(six);
      if(code<103||code>105) continue;
      const unit=six.reduce((a,b)=>a+b,0)/11;
      if(s>0 && !(!dark[s-1] && runs[s-1]>=unit*5)) continue;

      const vals=[code];
      let i=s+6, done=false;
      while(i+6<=runs.length && vals.length<80){
        const c6=runs.slice(i,i+6);
        const c=bestCode(c6);
        if(c<0) break;
        if(c===STOP){
          const after=i+7;
          const ok = after>=runs.length || (!dark[after] && runs[after]>=unit*3);
          if(ok && vals.length>=3){
            const txt=valsToText(vals);
            if(txt) found.push(txt);
          }
          done=true; break;
        }
        vals.push(c); i+=6;
      }
      if(done) s=i;
    }
    return found;
  }

  function readLine(line){
    const n=line.length;
    if(n<60) return [];
    let mn=255,mx=0;
    for(const v of line){ if(v<mn)mn=v; if(v>mx)mx=v; }
    if(mx-mn<40) return [];
    const out=[];
    for(const k of [0.35,0.45,0.5,0.55,0.65])
      for(const t of readAt(line, mn+(mx-mn)*k)) out.push(t);
    return out;
  }

  function decode(gray,w,h){
    const hits={};
    const angles=[0,-0.04,0.04,-0.09,0.09,-0.15,0.15,-0.22,0.22];
    const lines=Math.min(140,Math.max(40,h>>2));
    for(const a of angles){
      for(let k=0;k<lines;k++){
        const y0=Math.round((k+0.5)*h/lines);
        const line=new Uint8Array(w);
        let bad=false;
        for(let x=0;x<w;x++){
          const y=Math.round(y0+(x-w/2)*a);
          if(y<0||y>=h){ bad=true; break; }
          line[x]=gray[y*w+x];
        }
        if(bad) continue;
        for(const t of readLine(line)) hits[t]=(hits[t]||0)+1;
        const rev=Uint8Array.from(line).reverse();
        for(const t of readLine(rev)) hits[t]=(hits[t]||0)+1;
      }
    }
    /* короткие коды принимаем только при уверенном подтверждении */
    const all=Object.entries(hits).filter(e=>e[0].length>=2 && (e[0].length>=6 || e[1]>=8));
    if(!all.length) return [];
    const top=Math.max.apply(null, all.map(e=>e[1]));
    return all
      .filter(e=>e[1]>=Math.max(3, top*0.15))
      .sort((a,b)=>b[1]-a[1])
      .map(e=>e[0]);
  }

  return {decode};
}

  "🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🦆🦉🐺🐗🐴🦄🐝🐞🐟🐬🐳🦀🦐"+
  "🏀🏈⚾🎾🏐🎱🎳🎯🎲🧩🔔🔑🧱🪵🪨"
);
const PAL=[];
function ensurePalette(){
  if(PAL.length) return PAL.length;
  const N=22,c=document.createElement("canvas");c.width=c.height=N;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.textAlign="center";g.textBaseline="middle";
  for(const ch of Array.from(EMOJI_SET)){
    if(ch==="\uFE0F") continue;
    g.clearRect(0,0,N,N);
    g.font=Math.round(N*0.86)+"px "+EMOJI_FONT;
    g.fillText(ch,N/2,N/2);
    const d=g.getImageData(0,0,N,N).data;
    let r=0,gg=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){ if(d[i+3]<40)continue; r+=d[i];gg+=d[i+1];b+=d[i+2];n++; }
    if(n<N*N*0.10) continue;
    PAL.push({ch,r:r/n,g:gg/n,b:b/n});
  }
  return PAL.length;
}
function nearest(r,g,b){
  let best=PAL[0],bd=Infinity;
  for(const p of PAL){
    const rm=(r+p.r)/2,dr=r-p.r,dg=g-p.g,db=b-p.b;
    const d=(2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db;
    if(d<bd){bd=d;best=p;}
  }
  return best.ch;
}

/* ══════════════════════ вырезание ══════════════════════ */
const MP_CDNS=[
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision",
  "https://unpkg.com/@mediapipe/tasks-vision"
];
const MP_MODEL="https://storage.googleapis.com/mediapipe-models/image_segmenter/"+
               "selfie_segmenter/float16/latest/selfie_segmenter.tflite";
let segmenter=null;

async function getSegmenter(){
  if(segmenter) return segmenter;
  let last=null;
  for(const base of MP_CDNS){
    try{
      const mod=await import(base+"/vision_bundle.mjs");
      const fs=await mod.FilesetResolver.forVisionTasks(base+"/wasm");
      segmenter=await mod.ImageSegmenter.createFromOptions(fs,{
        baseOptions:{modelAssetPath:MP_MODEL},
        runningMode:"IMAGE",outputCategoryMask:true,outputConfidenceMasks:false});
      return segmenter;
    }catch(e){ last=e; }
  }
  throw last||new Error("CDN unreachable");
}

function fitSize(){
  const w=Math.min(1280, S.img.naturalWidth);
  return [w, Math.max(1, Math.round(S.img.naturalHeight*w/S.img.naturalWidth))];
}

function cacheSource(){
  const [w,h]=fitSize();
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(S.img,0,0,w,h);
  S.srcData=g.getImageData(0,0,w,h).data;
  S.mw=w;S.mh=h;S.hist=[];
}

/* готовая прозрачность (айфоновское «Скопировать объект») — модель не нужна */
function maskFromAlpha(){
  const n=S.mw*S.mh, d=S.srcData;
  const a=new Float32Array(n);
  let clear=0,hit=0;
  for(let i=0,p=3;i<n;i++,p+=4){
    a[i]=d[p];
    if(d[p]<250)clear++;
    if(d[p]>128)hit++;
  }
  if(clear<n*0.02) return false;
  S.mask=a;S.share=Math.round(hit/n*100);
  return true;
}

/* ───────── ручные инструменты: работают без сети ───────── */
function ensureMask(){
  if(!S.mask){ S.mask=new Float32Array(S.mw*S.mh).fill(255); S.share=100; }
}
function snapshot(){
  ensureMask();
  S.hist.push(Float32Array.from(S.mask));
  if(S.hist.length>8) S.hist.shift();
}

/* палочка: заливка по связной области близкого цвета */
function wandAt(mx,my){
  snapshot();
  const w=S.mw,h=S.mh,d=S.srcData,m=S.mask;
  const s=(my*w+mx)*4, r0=d[s],g0=d[s+1],b0=d[s+2];
  const tol=S.tol*S.tol*3;
  const seen=new Uint8Array(w*h);
  const stack=[my*w+mx];
  let n=0;
  while(stack.length){
    const p=stack.pop();
    if(seen[p]) continue;
    seen[p]=1;
    const q=p*4, dr=d[q]-r0, dg=d[q+1]-g0, db=d[q+2]-b0;
    if(dr*dr+dg*dg+db*db>tol) continue;
    if(m[p]!==0){ m[p]=0; n++; }
    const x=p%w, y=(p/w)|0;
    if(x>0) stack.push(p-1);
    if(x<w-1) stack.push(p+1);
    if(y>0) stack.push(p-w);
    if(y<h-1) stack.push(p+w);
  }
  return n;
}

/* кисть: стереть или вернуть кружком */
function brushAt(mx,my,val){
  const w=S.mw,h=S.mh,m=S.mask,r=S.brush,r2=r*r;
  const yA=Math.max(0,my-r), yB=Math.min(h-1,my+r);
  const xA=Math.max(0,mx-r), xB=Math.min(w-1,mx+r);
  for(let y=yA;y<=yB;y++){
    const dy=y-my;
    for(let x=xA;x<=xB;x++){
      const dx=x-mx;
      if(dx*dx+dy*dy<=r2) m[y*w+x]=val;
    }
  }
}

/* Запасной способ: фон — это то, что похоже по цвету на края кадра.
   Заливка идёт от всей рамки, порог берётся из ползунка «Похожесть цвета». */
function floodCut(){
  const w=S.mw,h=S.mh,d=S.srcData;
  const bg=new Uint8Array(w*h);
  const stack=[];
  const push=i=>{ if(!bg[i]){ bg[i]=1; stack.push(i); } };
  for(let x=0;x<w;x++){ push(x); push((h-1)*w+x); }
  for(let y=0;y<h;y++){ push(y*w); push(y*w+w-1); }
  const lim=S.tol*S.tol*3;
  while(stack.length){
    const i=stack.pop(), q=i*4;
    const r=d[q],g=d[q+1],b=d[q+2];
    const x=i%w, y=(i/w)|0;
    const nb=[];
    if(x>0)nb.push(i-1); if(x<w-1)nb.push(i+1);
    if(y>0)nb.push(i-w); if(y<h-1)nb.push(i+w);
    for(const j of nb){
      if(bg[j])continue;
      const p=j*4, dr=d[p]-r, dg=d[p+1]-g, db=d[p+2]-b;
      if(dr*dr+dg*dg+db*db<=lim){ bg[j]=1; stack.push(j); }
    }
  }
  const a=new Float32Array(w*h);
  let hit=0;
  for(let i=0;i<a.length;i++){ if(!bg[i]){a[i]=255;hit++;} }
  if(hit===0 || hit===w*h) return false;      // всё фоном или ничего — не помогло
  S.mask=a; S.share=Math.round(hit/(w*h)*100);
  return true;
}

async function segment(){
  const seg=await getSegmenter();
  say("working");
  const w=S.mw,h=S.mh;
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(S.img,0,0,w,h);
  const res=seg.segment(c);
  const mask=res.categoryMask, m=mask.getAsUint8Array();
  const x0=w*0.25|0,x1=w*0.75|0,y0=h*0.2|0,y1=h*0.85|0;
  const total={},mid={};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=m[y*w+x];
    total[v]=(total[v]||0)+1;
    if(x>=x0&&x<x1&&y>=y0&&y<y1) mid[v]=(mid[v]||0)+1;
  }
  let subject=null,best=-1;
  for(const k in total){
    const share=total[k]/(w*h);
    if(share>0.94||share<0.015) continue;
    const sc=(mid[k]||0)/total[k];
    if(sc>best){best=sc;subject=+k;}
  }
  mask.close(); if(res.close) res.close();
  if(subject===null){
    if(floodCut()){ drawCut(); say("segnone_fb",null,"good"); }
    else { S.mask=null; say("segnone_fb",null,"bad"); }
    return;
  }
  const a=new Float32Array(w*h);
  let hit=0;
  for(let i=0;i<m.length;i++) if(m[i]===subject){a[i]=255;hit++;}
  S.mask=a;S.share=Math.round(hit/(w*h)*100);
  drawCut();
  say("segok",[w,h,S.share],"good");
}

/* мягкий край: разделяемое размытие маски, без ctx.filter */
function blurAlpha(src,w,h,r){
  if(r<1) return src;
  const tmp=new Float32Array(w*h),out=new Float32Array(w*h),win=r*2+1;
  const cl=(v,max)=>v<0?0:v>max?max:v;
  for(let y=0;y<h;y++){
    let s=0;
    for(let x=-r;x<=r;x++) s+=src[y*w+cl(x,w-1)];
    for(let x=0;x<w;x++){
      tmp[y*w+x]=s/win;
      s-=src[y*w+cl(x-r,w-1)]; s+=src[y*w+cl(x+r+1,w-1)];
    }
  }
  for(let x=0;x<w;x++){
    let s=0;
    for(let y=-r;y<=r;y++) s+=tmp[cl(y,h-1)*w+x];
    for(let y=0;y<h;y++){
      out[y*w+x]=s/win;
      s-=tmp[cl(y-r,h-1)*w+x]; s+=tmp[cl(y+r+1,h-1)*w+x];
    }
  }
  return out;
}

/* собирает вырезанное с выбранным фоном */
function composeCut(canvas){
  const w=S.mw,h=S.mh;
  canvas.width=w;canvas.height=h;
  const g=canvas.getContext("2d",{willReadFrequently:true});
  g.clearRect(0,0,w,h);
  if(S.bg==="white"||S.bg==="dark"){
    g.fillStyle=S.bg==="white"?"#FFFFFF":"#14100E";
    g.fillRect(0,0,w,h);
  }else if(S.bg==="blur"){
    const k=Math.max(1,Math.round(w/40));
    const s=document.createElement("canvas");
    s.width=k;s.height=Math.max(1,Math.round(h*k/w));
    s.getContext("2d").drawImage(S.img,0,0,s.width,s.height);
    g.imageSmoothingEnabled=true;
    g.drawImage(s,0,0,w,h);
  }
  const cut=document.createElement("canvas");cut.width=w;cut.height=h;
  const cg=cut.getContext("2d",{willReadFrequently:true});
  cg.drawImage(S.img,0,0,w,h);
  const id=cg.getImageData(0,0,w,h);
  const soft=blurAlpha(S.mask,w,h,S.soft), shift=S.edge*2.55;
  for(let i=0,p=3;i<soft.length;i++,p+=4){
    const v=soft[i]+shift;
    id.data[p]=v<0?0:v>255?255:v;
  }
  cg.putImageData(id,0,0);
  g.drawImage(cut,0,0);
  return canvas;
}

/* маленькая копия холста — видно правки, не закрывая шторку */
function drawMini(){
  const box=el("miniBox"), sh=document.getElementById("sheet");
  if(!sh||!sh.classList.contains("on")){ if(box) box.hidden=true; return; }
  const m=el("mini"), fr=el("miniFrame");

    if(S.tab==="qr"){
      if(S.bars){ paintBars(m,2,1,false); }
      else if(S.qr){
        const n=S.qr.size,Q=2,mod=2,px=(n+Q*2)*mod;
        m.width=px;m.height=px;
        const g=m.getContext("2d");
        g.fillStyle="#FFFFFF";g.fillRect(0,0,px,px);
        g.fillStyle="#14100E";
        for(let y=0;y<n;y++)for(let x=0;x<n;x++)
          if(S.qr.grid[y][x]) g.fillRect((Q+x)*mod,(Q+y)*mod,mod,mod);
      }else{ box.hidden=true; return; }
      fr.className="frame";
    }else if(S.tab==="art"){
      if(!S.rows.length){ box.hidden=true; return; }
      paintArt(m,6,1);
      fr.className="frame"+((S.color&&S.mode!=="emoji")?" dark":"");
    }else{
      if(!S.mask){ box.hidden=true; return; }
      composeCut(m);
      fr.className="frame check";
    }
  }catch(e){ box.hidden=true; return; }
  box.hidden=false;
  const k=Math.min(300/m.width, 150/m.height, 1);
  m.style.width=Math.round(m.width*k)+"px";
  m.style.height=Math.round(m.height*k)+"px";
}

function drawCut(){
  if(S.tab!=="cut")return;
  el("board").className="board";
  if(!S.mask){ const c=el("cv"); c.width=1;c.height=1;
    el("toArt").disabled=true; el("dl").disabled=true; return; }

  el("toArt").disabled=false;
  el("dl").disabled=false;
  drawMini();
}

/* ══════════════════════ символы ══════════════════════ */
const FONT='Menlo, Monaco, "Courier New", monospace';
let CELL=0.6;
(function(){
  const g=document.createElement("canvas").getContext("2d");
  g.font='200px '+FONT;
  const w=g.measureText("M").width;
  if(w>40&&w<300) CELL=w/200;
})();

/* лимиты площадок и обёртка, которая сохраняет моноширинность */
/* maxw — сколько знаков влезает в окно площадки БЕЗ переноса строки.
   Перенос страшнее лимита: арт складывается пополам и превращается в кашу. */
const TARGETS={
  none:  {lim:0,    pre:"",          post:"",          lh:1.00, maxw:0},
  steam: {lim:1000, pre:"[code]\n",  post:"\n[/code]", lh:1.35, maxw:40},
  tg:    {lim:4096, pre:"```\n",     post:"\n```",     lh:1.25, maxw:32},
  vk:    {lim:4000, pre:"",          post:"",          lh:1.30, maxw:0}
};

let BRCELL=0.6;
(function(){
  const g=document.createElement("canvas").getContext("2d");
  g.font='200px '+FONT;
  const w=g.measureText("\u28FF").width;
  if(w>40&&w<400) BRCELL=w/200;
})();

const RAMPS={
  classic:"@%#*+=-:. ",
  punct:"@#&$%()[]{}?*+=;:,. ",
  detail:"$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ",
  blocks:"\u2588\u2593\u2592\u2591 ",
  binary:"10 ",
  braille:"\u28FF\u28F7\u28E7\u28C7\u2887\u2807\u2803\u2801\u2800"
};
const ramp=()=>{const r=S.ramp==="custom"?(S.custom||" "):RAMPS[S.ramp];
  return S.invert?Array.from(r).reverse().join(""):r;};

const work=document.createElement("canvas");
const wctx=work.getContext("2d",{willReadFrequently:true});

/* источник для символов: вырезанное, если оно есть, иначе оригинал */
function artSource(){
  if(S.mask) return composeCut(document.createElement("canvas"));
  return S.img;
}

function buildArt(){
  if(S.tab!=="art") return;
  if(!S.img){ say("needphoto",null,"bad"); return; }
  try{
    const emoji=S.mode==="emoji", brl=S.mode==="braille";
    if(emoji && !ensurePalette()){ say("fail",["emoji font"],"bad"); return; }
    const ch=ramp();
    const src=artSource();
    const sw=src.naturalWidth||src.width, sh=src.naturalHeight||src.height;
    const asp=(emoji?1:(brl?BRCELL:CELL))/S.lh;   // просвет между строками
    let c=emoji?Math.min(S.cols,72):S.cols;

    /* если текст пойдёт в Steam или ВК, сужаем кадр, пока не влезет в лимит */
    const G=TARGETS[S.target], extra=G.pre.length+G.post.length;
    let fitted=false;
    if(G.maxw && c>G.maxw){ c=G.maxw; fitted=true; }   // иначе строки переломятся
    if(G.lim){
      while(c>10){
        const rr=Math.max(1,Math.round(c*(sh/sw)*asp));
        if((c+1)*rr+extra<=G.lim) break;
        c-=2; fitted=true;
      }
    }
    const r=Math.max(1,Math.round(c*(sh/sw)*asp));
    const lines=[],tints=[],cells=[];
    const adj=v=>{const n=(v-128)*S.con+128+S.bri;return n<0?0:n>255?255:n;};
    const holes=!!S.mask;

    if(brl){
      /* Каждый знак брайля — 8 точек, поэтому берём сетку вдвое шире и вчетверо выше.
         Точки чёрно-белые, полутона даёт рассеивание ошибки по Флойду–Стейнбергу. */
      const W=c*2, H=r*4;
      work.width=W;work.height=H;
      wctx.clearRect(0,0,W,H);
      wctx.drawImage(src,0,0,W,H);
      const d=wctx.getImageData(0,0,W,H).data;
      const lum=new Float32Array(W*H), alpha=new Uint8Array(W*H);
      for(let i=0,p=0;i<lum.length;i++,p+=4){
        const A=d[p+3]; alpha[i]=A;
        const R=d[p]*(A/255)+(1-A/255)*255,
              G=d[p+1]*(A/255)+(1-A/255)*255,
              B=d[p+2]*(A/255)+(1-A/255)*255;
        lum[i]=adj(0.2126*R+0.7152*G+0.0722*B);
      }
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const i=y*W+x, old=lum[i], nv=old<128?0:255;
        lum[i]=nv;
        const e=old-nv;
        if(x+1<W) lum[i+1]+=e*7/16;
        if(y+1<H){
          if(x>0)   lum[i+W-1]+=e*3/16;
          lum[i+W]+=e*5/16;
          if(x+1<W) lum[i+W+1]+=e*1/16;
        }
      }
      const BIT=[[0,1,2,6],[3,4,5,7]];      // раскладка точек в кодировке брайля
      for(let cy=0;cy<r;cy++){
        let ln="", cl=[];
        for(let cx=0;cx<c;cx++){
          let bits=0;
          for(let dx=0;dx<2;dx++)for(let dy=0;dy<4;dy++){
            const px=cx*2+dx, py=cy*4+dy;
            if(px>=W||py>=H) continue;
            const i=py*W+px;
            if(holes && alpha[i]<90) continue;
            const on = S.invert ? lum[i]>=128 : lum[i]<128;
            if(on) bits |= 1<<BIT[dx][dy];
          }
          const g=String.fromCharCode(0x2800+bits);
          ln+=g; cl.push(g);
        }
        lines.push(ln); cells.push(cl);
      }
      S.rows=lines;S.cells=cells;S.tint=[];S.w=c;S.h=r;
      drawArt();
      if(G.lim) say("fitted",[c,text().length,G.lim], text().length<=G.lim?"good":"bad");
      else say("arted",[S.name,c,r],"good");
      return;
    }

    work.width=c;work.height=r;
    wctx.clearRect(0,0,c,r);
    wctx.drawImage(src,0,0,c,r);
    const d=wctx.getImageData(0,0,c,r).data;

    for(let y=0;y<r;y++){
      let ln="",tn=[],cl=[];
      for(let x=0;x<c;x++){
        const i=(y*c+x)*4,A=d[i+3];
        if(holes&&A<90){
          cl.push(emoji?"":" ");
          ln+=emoji?"\u2B1C":" ";
          if(S.color&&!emoji)tn.push("#EDE6D8");
          continue;
        }
        const R=d[i]*(A/255)+(1-A/255)*255,
              G=d[i+1]*(A/255)+(1-A/255)*255,
              B=d[i+2]*(A/255)+(1-A/255)*255;
        if(emoji){
          const e=nearest(adj(R),adj(G),adj(B));
          cl.push(e);ln+=e;
        }else{
          const g=ch.charAt(Math.min(ch.length-1,Math.floor(adj(0.2126*R+0.7152*G+0.0722*B)/256*ch.length)));
          cl.push(g);ln+=g;
          if(S.color)tn.push("rgb("+d[i]+","+d[i+1]+","+d[i+2]+")");
        }
      }
      lines.push(ln);cells.push(cl);
      if(S.color&&!emoji)tints.push(tn);
    }
    S.rows=lines;S.cells=cells;S.tint=tints;S.w=c;S.h=r;
    drawArt();
    if(G.lim) say("fitted",[c,text().length,G.lim], text().length<=G.lim?"good":"bad");
    else say("arted",[S.name,c,r],"good");
  }catch(err){ say("fail",[err.message],"bad"); }
}

function paintArt(canvas,cellW,dpr){
  const emoji=S.mode==="emoji";
  const cell=S.mode==="braille"?BRCELL:CELL;
  const lh=(emoji?cellW:cellW/cell)*S.lh;
  const fs=emoji?cellW*0.92:cellW/cell;
  const cols=S.w,rows=S.rows.length;
  const cssW=cellW*cols,cssH=lh*rows;
  canvas.width=Math.max(1,Math.round(cssW*dpr));
  canvas.height=Math.max(1,Math.round(cssH*dpr));
  canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
  const g=canvas.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=(S.color&&!emoji)?"#0C0908":"#EDE6D8";
  g.fillRect(0,0,cssW,cssH);
  if(emoji){
    g.font=fs+"px "+EMOJI_FONT;
    g.textAlign="center";g.textBaseline="middle";
    for(let y=0;y<rows;y++){
      const line=S.cells[y];
      for(let x=0;x<line.length;x++){
        if(!line[x])continue;
        g.fillText(line[x],x*cellW+cellW/2,y*lh+lh/2);
      }
    }
    g.textAlign="left";g.textBaseline="top";
    return {w:canvas.width,h:canvas.height};
  }
  g.font=fs+"px "+FONT;
  g.textBaseline="top";
  const off=(lh-fs)/2;                     // центрируем строку в её полосе
  for(let y=0;y<rows;y++){
    const ln=S.rows[y];
    if(S.color){
      for(let x=0;x<ln.length;x++){
        g.fillStyle=S.tint[y][x];
        g.fillText(ln.charAt(x),x*cellW,y*lh+off);
      }
    }else{
      g.fillStyle="#14100E";
      g.fillText(ln,0,y*lh+off);
    }
  }
  return {w:canvas.width,h:canvas.height};
}

function drawArt(){
  if(S.tab!=="art"||!S.rows.length)return;
  const b=el("board");
  b.className="board flat"+((S.color&&S.mode!=="emoji")?" dark":"");
  const avail=Math.max(60, el("stage").clientWidth-24-16);
  const cellW=S.zoom>0?S.zoom:avail/S.w;
  const lh=(S.mode==="emoji"?cellW:cellW/(S.mode==="braille"?BRCELL:CELL))*S.lh;
  let dpr=Math.min(3,window.devicePixelRatio||1);
  while(cellW*S.w*dpr*lh*S.rows.length*dpr>16000000&&dpr>1) dpr-=0.5;
  paintArt(el("cv"),cellW,dpr);
  el("dl").disabled=false;
  drawMini();
}

  if(inFrame) return "segfail_frame";
  if(location.protocol==="file:") return "segfail_file";
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||
            (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

function load(f){

/* ══════════════════ вкладка QR ══════════════════ */
S.qr=null; S.bars=null;          // {size,grid,version} | [{txt,bits}, …]
S.codeSize="m"; S.barNum=true;   // масштаб кода и подпись под полосами
const SIZEK={s:0.6, m:1, l:1.6};
function buildQr(){
  const txt=(el("qrText").value||"").trim();
  S.bars=null;
  if(!txt){ S.qr=null; say("qr_empty",null,"bad"); drawQr(); return; }
  if(el("codeKind").value==="bar"){
    S.qr=null;
    /* несколько чисел через пробел, запятую или перенос — каждый станет своим кодом */
    const parts=txt.split(/[\s,;]+/).filter(Boolean).slice(0,8);
    const list=[];
    for(const part of parts){
      const r=code128(part);
      if(r.err){ S.bars=null; say(r.err==="ascii"?"bar_ascii":"bar_long",null,"bad"); drawQr(); return; }
      list.push({txt:part, bits:r.bits});
    }
    S.bars=list;
    drawQr();
    say(list.length>1?"bars_done":"bar_done",[list.length>1?list.length:list[0].bits.length],"good");
    return;
  }
  const q=QR.encode(txt, el("qrLvl").value);
  if(!q){ S.qr=null; say("qr_long",null,"bad"); drawQr(); return; }
  S.qr=q;
  drawQr();
  say("qr_done",[q.version,q.size],"good");
}
function qrRows(){
  /* два модуля в одном знаке: █ ▀ ▄ и пробел — QR остаётся квадратным в моношрифте */
  const g=S.qr.grid,n=S.qr.size,out=[];
  const Q=2;                                    // тихая зона в модулях
  for(let y=-Q;y<n+Q;y+=2){
    let ln="";
    for(let x=-Q;x<n+Q;x++){
      const top=(y>=0&&y<n&&x>=0&&x<n)?g[y][x]:0;
      const bot=(y+1>=0&&y+1<n&&x>=0&&x<n)?g[y+1][x]:0;
      ln+= top&&bot?"\u2588": top?"\u2580": bot?"\u2584":" ";
    }
    out.push(ln);
  }
  return out;
}
/* рисует стопку штрих-кодов; M — ширина одного модуля в пикселях */
function paintBars(c,M,dpr,label){
  const list=S.bars;
  const maxBits=Math.max(...list.map(b=>b.bits.length));
  const W=Math.round((maxBits+20)*M);
  const barH=Math.round(Math.max(46, Math.min(150, W*0.22)));
  const cap=label?Math.round(M*7)+6:0;                 // место под подпись
  const rowH=barH+cap+Math.round(M*4);
  const H=rowH*list.length+Math.round(M*4);
  c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  c.style.width=W+"px"; c.style.height=H+"px";
  const g=c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,H);
  list.forEach((b,k)=>{
    const y=Math.round(M*2)+k*rowH;
    const x0=Math.round((W-b.bits.length*M)/2);        // по центру
    g.fillStyle="#14100E";
    for(let i=0;i<b.bits.length;i++)
      if(b.bits[i]==="1") g.fillRect(x0+i*M, y, M+0.05, barH);
    if(label){
      g.font=Math.round(M*7)+"px "+FONT;
      g.textAlign="center"; g.textBaseline="top";
      g.fillText(b.txt, W/2, y+barH+4);
      g.textAlign="left";
    }
  });
  return {w:c.width,h:c.height};
}
function drawBar(c){
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const avail=Math.max(160, el("stage").clientWidth-24-16);
  const maxBits=Math.max(...S.bars.map(b=>b.bits.length));
  const M=Math.max(1, Math.min(6, avail/(maxBits+20)*SIZEK[S.codeSize]));
  paintBars(c,M,dpr,S.barNum);
}
function drawQr(){
  if(S.tab!=="qr")return;
  const b=el("board"), c=el("cv");
  if(S.bars){ drawBar(c); b.className="board flat"; el("dl").disabled=false; drawMini(); return; }
  if(!S.qr){ c.width=1;c.height=1; b.className="board flat"; el("dl").disabled=true; return; }
  const style=el("qrStyle").value;
  const avail=Math.max(120, el("stage").clientWidth-24-16);
  if(style==="blocks"){
    const rows=qrRows();
    const cellW=Math.min(14, avail/rows[0].length);
    const dpr=Math.min(3,window.devicePixelRatio||1);
    const lh=cellW/0.5;                          // блоки почти квадратны при lh=2*cellW
    c.width=Math.round(rows[0].length*cellW*dpr);
    c.height=Math.round(rows.length*lh*dpr);
    c.style.width=(rows[0].length*cellW)+"px";
    c.style.height=(rows.length*lh)+"px";
    const g=c.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle="#FFFFFF";g.fillRect(0,0,c.width,c.height);
    g.fillStyle="#14100E";
    g.font=(lh)+"px "+FONT; g.textBaseline="top";
    rows.forEach((ln,i)=>g.fillText(ln,0,i*lh));
  }else{
    const n=S.qr.size, Q=4;                      // тихая зона 4 модуля
    const mod=Math.max(1,Math.floor(Math.min(avail,420)/(n+Q*2)*SIZEK[S.codeSize]));
    const px=(n+Q*2)*mod, dpr=Math.min(3,window.devicePixelRatio||1);
    c.width=px*dpr; c.height=px*dpr;
    c.style.width=px+"px"; c.style.height=px+"px";
    const g=c.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle="#FFFFFF"; g.fillRect(0,0,px,px);
    g.fillStyle="#14100E";
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)
      if(S.qr.grid[y][x]) g.fillRect((Q+x)*mod,(Q+y)*mod,mod,mod);
  }
  b.className="board flat";
  el("dl").disabled=false;
  drawMini();
}

  el("charset").value=S.ramp; el("custom").value=S.custom;
  el("con").value=S.con; el("conVal").textContent=S.con.toFixed(2);
  el("bri").value=S.bri; el("briVal").textContent=S.bri;
  el("zoom").value=S.zoom; el("zoomVal").textContent=t("fit");
  el("quality").value=S.quality; el("qVal").textContent=S.quality+" px";
  el("target").value=S.target; targetTip();
  S.codeSize="m"; el("codeSize").value="m";
  S.barNum=true; el("barNum").setAttribute("aria-pressed","true");
  el("lh").value=S.lh; el("lhVal").textContent=S.lh.toFixed(2);
  el("invert").setAttribute("aria-pressed","false");
  el("color").setAttribute("aria-pressed","false");
  sheetUI();
  S.tab==="art"?buildArt():drawCut();
  say("resetdone",null,"good");
});


/* ───────── чтение штрих-кода с фотографии ───────── */
function scanFile(file){
  if(!file){ say("nofile",null,"bad"); return; }
  say("scanning");
  const fr=new FileReader();
  fr.onerror=()=>say("noread",null,"bad");
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>say("nodecode",null,"bad");
    im.onload=()=>{
      /* ужимаем до 1400 px — этого хватает и считается быстро */
      const w=Math.min(1400, im.naturalWidth);
      const hh=Math.max(1,Math.round(im.naturalHeight*w/im.naturalWidth));
      const c=document.createElement("canvas");
      c.width=w; c.height=hh;
      const g=c.getContext("2d",{willReadFrequently:true});
      g.drawImage(im,0,0,w,hh);
      const d=g.getImageData(0,0,w,hh).data;
      const gray=new Uint8Array(w*hh);
      for(let i=0,p=0;i<gray.length;i++,p+=4)
        gray[i]=(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114)|0;
      let res=[];
      try{ res=SCAN.decode(gray,w,hh); }catch(_){ res=[]; }
      if(!res.length){ say("scan_none",null,"bad"); return; }
      if(S.tab!=="qr") setTab("qr");
      el("codeKind").value="bar";
      el("codeKind").dispatchEvent(new Event("change"));
      el("qrText").value=res.join(" ");
      buildQr();
      say("scan_ok",[res.length],"good");
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
el("fScan").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  scanFile(f);
});

/* ══════════════════════ вывод ══════════════════════ */
const text=()=>{
  if(S.tab==="qr" && S.bars){          // у штрих-кода копируем сами числа
    return S.bars.map(b=>b.txt).join("\n");
  }
  if(S.tab==="qr" && S.qr){
    const body=qrRows().join("\n");
    const G=TARGETS[S.target];
    return (G.lim?G.pre:"") + body + (G.lim?G.post:"");
  }
  const G=TARGETS[S.target];
  return G.pre + S.rows.join("\n") + G.post;
};
const outName=ext=> S.tab==="qr" ? "qr-code."+ext :
  (S.name||"photo")+t(S.tab==="art"?"sfx_art":"sfx_cut")+"."+ext;
const inFrame=(()=>{try{return window.top!==window.self;}catch(e){return true;}})();
/* Telegram, VK и прочие встроенные браузеры глушат скачивание файлов —
   там единственный рабочий путь: показать картинку и сохранить долгим нажатием. */
const inApp=(()=>{
  if(inFrame) return true;
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData!==undefined) return true;
  return /Telegram|Instagram|FBAN|FBAV|VKClient|Line\//i.test(navigator.userAgent||"");
})();

function pngBlob(){
  const off=document.createElement("canvas");
  let size;
  if(S.tab==="qr" && S.bars){
    const maxBits=Math.max(...S.bars.map(b=>b.bits.length));
    const M=Math.max(2,Math.round(S.quality/(maxBits+20)*SIZEK[S.codeSize]));
    size=paintBars(off,M,1,S.barNum);
    return new Promise(r=>off.toBlob(b2=>r({blob:b2,size}),"image/png"));
  }
  if(S.tab==="qr" && S.qr){
    const n=S.qr.size,Q=4,mod=Math.max(4,Math.round(S.quality/(n+Q*2)*SIZEK[S.codeSize]));
    const px=(n+Q*2)*mod;
    off.width=px;off.height=px;
    const g=off.getContext("2d");
    g.fillStyle="#FFFFFF";g.fillRect(0,0,px,px);
    g.fillStyle="#000000";
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)
      if(S.qr.grid[y][x]) g.fillRect((Q+x)*mod,(Q+y)*mod,mod,mod);
    size={w:px,h:px};
    return new Promise(r=>off.toBlob(b=>r({blob:b,size}),"image/png"));
  }
  if(S.tab==="art"){
    size=paintArt(off,Math.max(3,S.quality/S.w),1);
  }else{
    composeCut(off); size={w:off.width,h:off.height};
  }
  return new Promise(r=>off.toBlob(b=>r({blob:b,size}),"image/png"));
}
function viewImage(blob){
  const url=URL.createObjectURL(blob);
  el("vimg").src=url;el("viewer").hidden=false;
  el("vclose").onclick=()=>{el("viewer").hidden=true;URL.revokeObjectURL(url);};
}
async function save(blob,ext,size){
  const name=outName(ext);
  if(inApp && ext==="png"){          // встроенный браузер: скачивание не сработает
    viewImage(blob);
    say("inframe",null,"bad");
    return;
  }
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({suggestedName:name,
        types:[{accept:ext==="png"?{"image/png":[".png"]}:{"text/plain":[".txt"]}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();
      say("saved_picked",null,"good");return;
    }catch(e){ if(e.name==="AbortError")return; }
  }
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=name;a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
  }catch(e){}
  if(inFrame){ say("inframe",null,"bad"); if(ext==="png")viewImage(blob); }
  else if(size) say("pngsize",[size.w,size.h,Math.round(blob.size/1024)],"good");
  else say("saved_dl",null,"good");
}
/* есть ли что сохранять на текущей вкладке */
function hasOutput(){
  if(S.tab==="qr") return !!(S.qr||S.bars);
  if(S.tab==="art") return !!S.rows.length;
  return !!S.img;
}
function redrawCurrent(){
  S.tab==="art"?drawArt():S.tab==="qr"?drawQr():drawCut();
}

el("png").addEventListener("click",async()=>{
  if(!hasOutput()){say("needphoto",null,"bad");return;}
  const r=await pngBlob(); redrawCurrent(); save(r.blob,"png",r.size);
});
el("txt").addEventListener("click",()=>save(new Blob([text()],{type:"text/plain;charset=utf-8"}),"txt"));
/* «Скачать» — сразу файл, без системного меню */
el("dl").addEventListener("click",async()=>{
  if(!hasOutput()){say("needphoto",null,"bad");return;}
  const r=await pngBlob(); redrawCurrent();
  save(r.blob,"png",r.size);
});

/* «Поделиться» — системное меню, если браузер его даёт */
el("copyChip").addEventListener("click",()=>el("copy").click());
el("shareChip").addEventListener("click",async()=>{
  try{
    const r=await pngBlob(); redrawCurrent();
    const file=new File([r.blob],outName("png"),{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:t("title")});return;
    }
    save(r.blob,"png",r.size);
  }catch(e){ if(e.name!=="AbortError")say("noshare",[e.message],"bad"); }
});
el("copy").addEventListener("click",async()=>{
  const done=()=> (S.tab!=="qr" && S.mode==="emoji") ? say("emojicopy",null,"bad") : say("copied",[text().split("\n").length],"good");
  try{ await navigator.clipboard.writeText(text()); done(); }
  catch(e){
    const ta=document.createElement("textarea");ta.value=text();
    ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(_){}
    ta.remove();
    ok?done():say("nocopy",null,"bad");
  }
});

/* ══════════════════════ старт ══════════════════════ */
applyLang();
setTab("cut");
say("ready");
</script>
